[package]
name = "bochs-display"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "An Ambrosia graphics driver module for QEMU's bochs-display, the interface's example"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
readme = "README.md"
publish = false

# A module is its own program, linked as a static PIE (.cargo/config.toml),
# so it is its own workspace and not part of the image's.
[workspace]

[[bin]]
name = "bochs-display"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

# The same lints as the image's workspace (../../Cargo.toml).
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
cast_lossless = "warn"
missing_safety_doc = "deny"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "deny"
